<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A · Centred list (Excalidraw-like)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      .w {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 18px 0 30px;
        font-size: 15px;
        line-height: 1.55;
        max-width: 360px;
      }
      .rows {
        width: 100%;
        max-width: 280px;
        display: grid;
        gap: 2px;
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 7px;
        font-size: 14px;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .row:hover {
        background: color-mix(in oklab, var(--foreground) 8%, transparent);
        color: var(--foreground);
      }
      .row svg {
        width: 16px;
        height: 16px;
      }
      .row .keys {
        margin-left: auto;
      }
      .small .brand {
        font-size: 26px;
      }
      .small .desc {
        margin: 10px 0 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <div class="brand">{{logo}} Jot</div>
        <p class="desc muted">
          Fast notes that sync across your devices and work offline.<br />Everything is saved on
          this device first.
        </p>
        <div class="rows">
          <div class="row">{{icon:plus}} New note {{keys:Mod+N}}</div>
          <div class="row">{{icon:search}} Search notes {{keys:Mod+P}}</div>
          <div class="row">{{icon:actions}} Actions {{keys:Mod+K}}</div>
          <div class="row">{{icon:trash}} Recently deleted</div>
        </div>
      </div>
    </template>
  </body>
</html>
