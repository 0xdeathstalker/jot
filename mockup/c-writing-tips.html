<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C · Shortcuts and writing tips</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      .w {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 10px 0 28px;
        font-size: 14px;
        text-align: center;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        width: 100%;
        max-width: 560px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-foreground);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 9px;
        font-size: 14px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      code {
        font:
          12px ui-monospace,
          Consolas,
          monospace;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--muted);
      }
      .small .cols {
        grid-template-columns: 1fr;
        gap: 16px;
        max-width: 300px;
      }
      .small .brand {
        font-size: 24px;
      }
      .small .desc {
        margin-bottom: 14px;
        font-size: 13px;
      }
      .small ul {
        gap: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <div class="brand">{{logo}} Jot</div>
        <p class="desc muted">Fast notes that sync across your devices and work offline.</p>
        <div class="cols">
          <section>
            <h2>Get around</h2>
            <ul>
              <li>New note {{keys:Mod+N}}</li>
              <li>Search notes {{keys:Mod+P}}</li>
              <li>Actions {{keys:Mod+K}}</li>
              <li>Back / forward <span class="keys">{{keys:Mod+[}} {{keys:Mod+]}}</span></li>
            </ul>
          </section>
          <section>
            <h2>While writing</h2>
            <ul>
              <li>Heading <code># </code></li>
              <li>Checklist <code>- [ ] </code></li>
              <li>Link {{keys:Mod+L}}</li>
              <li>
                Paste Markdown <span class="muted" style="font-size: 12px">kept as formatting</span>
              </li>
            </ul>
          </section>
        </div>
      </div>
    </template>
  </body>
</html>
