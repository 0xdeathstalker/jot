<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M3 · Phone: one button</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* F's header, then one clear next step; the rest as quiet text links. */
      .w {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px 24px 60px;
        text-align: center;
      }
      .head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand .logo {
        width: 34px;
        height: 34px;
      }
      .desc {
        margin: 0;
        font-size: 15px;
        max-width: 260px;
        line-height: 1.5;
      }
      .btn {
        height: 48px;
        padding: 0 28px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--popover);
        color: var(--foreground);
        font: inherit;
        font-size: 16px;
        font-weight: 500;
      }
      .btn svg {
        width: 18px;
        height: 18px;
      }
      .links {
        align-items: center;
        display: flex;
        gap: 6px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted-foreground);
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 10px 4px;
      }
    </style>
  </head>
  <body data-device="phone">
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <div class="head">
          <div class="brand">{{logo}} Jot</div>
          <p class="desc muted">Fast notes that sync across your devices and work offline.</p>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <button type="button" class="btn">{{icon:plus}} New note</button>
          <div class="links muted">
            <a href="#">Search notes</a><span>·</span><a href="#">Actions</a>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
