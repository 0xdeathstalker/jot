<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F · Combined (A + E)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* Three blocks: title + description, the bar, the rows. The gaps between blocks (32px) are
         clearly larger than the space inside each, so they read as three groups. */
      .w {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 24px;
        text-align: center;
      }
      .head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 0;
        font-size: 15px;
      }
      /* A button styled like an input: a click opens the Action Panel (Ctrl+K). */
      .bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--popover);
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.08);
        color: var(--muted-foreground);
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      .bar:hover {
        border-color: color-mix(in oklab, var(--muted-foreground) 50%, transparent);
      }
      .bar svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .bar .keys {
        margin-left: auto;
      }
      .rows {
        width: 100%;
        max-width: 280px;
        display: grid;
        gap: 2px;
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 7px;
        font-size: 14px;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .row:hover {
        background: color-mix(in oklab, var(--foreground) 8%, transparent);
        color: var(--foreground);
      }
      .row svg {
        width: 16px;
        height: 16px;
      }
      .row .keys,
      .row .note {
        margin-left: auto;
      }
      .row .note {
        font-size: 12px;
      }
      /* Global hotkey: desktop app only (shown here with the "Desktop window" toggle). */
      .app:not(.small) .desktop-only {
        display: none;
      }
      .small .w {
        gap: 20px;
      }
      .small .brand {
        font-size: 26px;
      }
      .small .desc {
        font-size: 13px;
      }
      .small .bar {
        font-size: 13px;
        padding: 9px 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <div class="head">
          <div class="brand">{{logo}} Jot</div>
          <p class="desc muted">Fast notes that sync across your devices and work offline.</p>
        </div>
        <button type="button" class="bar">
          {{icon:actions}} What would you like to do? {{keys:Mod+K}}
        </button>
        <div class="rows">
          <div class="row">{{icon:plus}} New note {{keys:Mod+N}}</div>
          <div class="row">{{icon:search}} Search notes {{keys:Mod+P}}</div>
          <div class="row desktop-only">
            {{icon:keyboard}} Global hotkey… <span class="note muted">Ctrl+Alt+J</span>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
