<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B · Keycap card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      .w {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 .logo {
        width: 28px;
        height: 28px;
      }
      .tag {
        margin: 6px 0 24px;
        font-size: 14px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .cell:hover {
        background: color-mix(in oklab, var(--foreground) 6%, transparent);
      }
      .cell b {
        font-weight: 500;
        font-size: 14px;
      }
      .cell .muted {
        font-size: 12px;
      }
      .small .card {
        grid-template-columns: 1fr;
        max-width: 300px;
      }
      .small .cell {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
      }
      .small .cell .muted {
        display: none;
      }
      .small .tag {
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <h1>{{logo}} Jot</h1>
        <p class="tag muted">Notes that sync and work offline.</p>
        <div class="card">
          <div class="cell">
            <b>New note</b>{{keys:Mod+N}}<span class="muted"
              >Start writing. Empty notes are never kept.</span
            >
          </div>
          <div class="cell">
            <b>Search notes</b>{{keys:Mod+P}}<span class="muted"
              >Jump to any note by its words.</span
            >
          </div>
          <div class="cell">
            <b>Actions</b>{{keys:Mod+K}}<span class="muted"
              >Everything else: pin, share, delete.</span
            >
          </div>
          <div class="cell">
            <b>Pin note</b>{{keys:Mod+Shift+P}}<span class="muted"
              >Keep a note at the top of the list.</span
            >
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
