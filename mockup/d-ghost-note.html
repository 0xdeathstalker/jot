<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D · Ghost note</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      .w {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 32px;
      }
      .ghost {
        opacity: 0.55;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.7;
      }
      .task {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        font-size: 16px;
      }
      .box {
        width: 16px;
        height: 16px;
        border: 1px solid var(--border);
        border-radius: 5px;
        flex: none;
      }
      code {
        font:
          13px ui-monospace,
          Consolas,
          monospace;
      }
      .caret {
        display: inline-block;
        width: 1.5px;
        height: 1.1em;
        margin-left: 2px;
        background: var(--primary);
        vertical-align: -0.15em;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .hint {
        margin-top: 28px;
        font-size: 13px;
      }
      .small .w {
        padding: 12px 16px;
      }
      .small h2 {
        font-size: 21px;
      }
      .small p,
      .small .task {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="welcome">
      <div class="w">
        <div class="ghost">
          <h2>Welcome to Jot<span class="caret"></span></h2>
          <p>Notes here sync across your devices and keep working offline.</p>
          <p>
            Press {{keys:Mod+N}} for a new note, {{keys:Mod+P}} to find one, and {{keys:Mod+K}} for
            everything else.
          </p>
          <div class="task"><span class="box"></span> Type <code>- [ ] </code> for a checklist</div>
          <div class="task">
            <span class="box"></span> Select text and press {{keys:Mod+L}} for a link
          </div>
        </div>
        <p class="hint muted">Start typing to turn this into your first note.</p>
      </div>
    </template>
  </body>
</html>
