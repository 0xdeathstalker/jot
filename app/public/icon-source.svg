<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Jot</title>
  <!-- Full-bleed square: Android/iOS apply their own rounding. Keep artwork inside the middle 80%. -->
  <rect width="512" height="512" fill="#111111" />
  <!-- A bold "J" with a short top bar, drawn as a stroke so it needs no font. -->
  <path
    d="M222 140 H322 M322 140 V288 Q322 380 232 380 Q172 380 150 330"
    fill="none"
    stroke="#ffffff"
    stroke-width="68"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
